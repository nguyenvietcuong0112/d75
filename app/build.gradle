android {
    namespace 'com.widget.themes.controlcenter'
    compileSdk 37

    defaultConfig {
        applicationId "com.widget.themes.controlcenter"
        minSdk 26
        targetSdk 36
        versionCode 5
        versionName "0.0.5"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
        }
    }


    signingConfigs {
        release {
            storeFile rootProject.file("keystore/gameempire.jks")
            storePassword "gameempire"
            keyAlias "gameempire"
            keyPassword "gameempire"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ['-Xskip-metadata-version-check']
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def formattedDate = new java.text.SimpleDateFormat("yyyyMMdd_HHmm").format(new Date())
            def vName = variant.versionName
            def vCode = variant.versionCode
            def buildType = variant.buildType.name
            outputFileName = "D75_Theme_v${vName}_c${vCode}_${formattedDate}-${buildType}.apk"
        }
    }
}

tasks.configureEach { task ->
    if (task.name.startsWith("bundle") && (task.name.endsWith("Release") || task.name.endsWith("Debug"))) {
        task.doLast {
            def buildType = task.name.endsWith("Release") ? "release" : "debug"
            def formattedDate = new java.text.SimpleDateFormat("yyyyMMdd_HHmm").format(new Date())
            def vName = android.defaultConfig.versionName
            def vCode = android.defaultConfig.versionCode
            def bundleDir = new File(layout.buildDirectory.asFile.get(), "outputs/bundle/${buildType}")
            def defaultAab = new File(bundleDir, "app-${buildType}.aab")
            if (defaultAab.exists()) {
                def targetFile = new File(bundleDir, "D75_Theme_v${vName}_c${vCode}_${formattedDate}-${buildType}.aab")
                java.nio.file.Files.copy(defaultAab.toPath(), targetFile.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                println("Generated AAB: ${targetFile.name}")
            }
        }
    }
}

